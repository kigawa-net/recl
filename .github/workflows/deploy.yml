name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recl-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run tests
        run: gradle test --no-daemon --stacktrace

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: harbor.kigawa.net/kigawa-net/recl:${{ github.sha }}

      - name: Update GitOps image tag
        env:
          GH_TOKEN: ${{ secrets.K8S_DEPLOY_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/kigawa-net/kigawa-net-k8s.git" /tmp/kigawa-net-k8s
          cd /tmp/kigawa-net-k8s
          sed -i -E "s|(harbor\.kigawa\.net/kigawa-net/recl:).*|\\1${IMAGE_TAG}|" recl/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recl/deployment.yaml
          if git diff --cached --quiet; then
            echo "Image tag already deployed"
            exit 0
          fi
          git commit -m "Deploy recl ${IMAGE_TAG}"
          git push
